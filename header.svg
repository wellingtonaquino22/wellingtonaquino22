<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 90">
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    @media (prefers-color-scheme: light) {
      .cover { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .cover { fill: #0d1117; }
    }
  </style>

  <!-- Line 1: title -->
  <text class="mono" x="330" y="36" text-anchor="middle"
    font-size="22" font-weight="700" fill="#e6edf3">
    Hi, I&#x27;m Wellington Aquino &#x1F44B;
  </text>

  <!-- Line 2: subtitle -->
  <text class="mono" x="330" y="66" text-anchor="middle"
    font-size="13" fill="#8b949e">
    Full-stack Developer &#xB7; Back-end focused &#xB7; Building scalable and clean solutions
  </text>

  <!-- Cover line 1 -->
  <rect class="cover" x="0" y="12" width="660" height="30">
    <animate attributeName="x" from="0" to="660" begin="0.2s" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Cover line 2 (starts after line 1 finishes) -->
  <rect class="cover" x="0" y="48" width="660" height="26">
    <animate attributeName="x" from="0" to="660" begin="1.6s" dur="2.0s" fill="freeze"/>
  </rect>
</svg>
