<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 100">
  <style>
    @media (prefers-color-scheme: dark) {
      .title   { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
    }
    @media (prefers-color-scheme: light) {
      .title   { fill: #24292f; }
      .subtitle { fill: #57606a; }
    }
  </style>

  <!-- Title -->
  <text
    class="title"
    x="330" y="42"
    text-anchor="middle"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    opacity="0"
  >
    Hi, I&#x27;m Wellington Aquino &#x1F44B;
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.9s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text
    class="subtitle"
    x="330" y="74"
    text-anchor="middle"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="13"
    opacity="0"
  >
    Full-stack Developer &#xB7; Back-end focused &#xB7; Building scalable and clean solutions
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
